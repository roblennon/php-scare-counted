# The four front doors, one vulnerable engine (php 8.4.26, below-fix floor).
# post_max_size is set small (2M) in both PHP containers so the probe is
# cheap: a 3MB body crosses the limit without abusing anyone's bandwidth —
# including yours. Everything binds to localhost only.
services:
  bare-apache:
    image: php:8.4.26-apache
    volumes:
      - ./www:/var/www/html:ro
      - ./php-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini:ro
    ports: ["127.0.0.1:8401:80"]
  nginx-fpm:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ["127.0.0.1:8402:80"]
    depends_on: [fpm]
  fpm:
    image: php:8.4.26-fpm
    volumes:
      - ./www:/var/www/html:ro
      - ./php-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini:ro
  proxy-fpm:
    image: httpd:alpine
    volumes: ['./httpd-proxy-fpm.conf:/usr/local/apache2/conf/httpd.conf:ro']
    ports: ["127.0.0.1:8403:80"]
    depends_on: [fpm2]
  fpm2:
    image: php:8.4.26-fpm
    volumes:
      - ./www:/var/www/html:ro
      - ./php-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini:ro
